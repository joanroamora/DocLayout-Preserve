apiVersion: apps/v1
kind: Deployment
metadata:
  name: doclayout-api
  namespace: doclayout-preserve
  labels:
    app.kubernetes.io/name: doclayout-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: DocLayout-Preserve
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: doclayout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doclayout-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: DocLayout-Preserve
    spec:
      serviceAccountName: doclayout-api-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/bitcitychamp-project/doclayout-preserve/doclayout-app:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - doclayout.api.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --no-access-log
          ports:
            - name: http-api
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: doclayout-config
            - secretRef:
                name: doclayout-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http-api
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-api
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
