apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doclayout-ingress
  namespace: doclayout-preserve
  labels:
    app.kubernetes.io/part-of: DocLayout-Preserve
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - doclayout.example.internal
      secretName: doclayout-tls-cert
  rules:
    - host: doclayout.example.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: doclayout-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: doclayout-ui
                port:
                  number: 8501
