apiVersion: apps/v1
kind: Deployment
metadata:
  name: doclayout-ui
  namespace: doclayout-preserve
  labels:
    app.kubernetes.io/name: doclayout-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: DocLayout-Preserve
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: doclayout-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doclayout-ui
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: DocLayout-Preserve
    spec:
      serviceAccountName: doclayout-ui-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: us-central1-docker.pkg.dev/bitcitychamp-project/doclayout-preserve/doclayout-app:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - streamlit
            - run
            - src/doclayout/ui/app.py
            - --server.address=0.0.0.0
            - --server.port=8501
            - --server.headless=true
            - --browser.gatherUsageStats=false
          ports:
            - name: http-ui
              containerPort: 8501
              protocol: TCP
          envFrom:
            - configMapRef:
                name: doclayout-config
            - secretRef:
                name: doclayout-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http-ui
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http-ui
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http-ui
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
