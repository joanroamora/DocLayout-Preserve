[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doclayout-preserve"
version = "0.1.0"
description = "Document Layout Preservation Engine & Toolkit with Gemini Multimodal AI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Joan Ricardo Roa Mora", email = "joanroamora@gmail.com" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".cache/pytest"
addopts = "-q --tb=short"

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.mypy]
cache_dir = ".cache/mypy"
mypy_path = "src"
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
