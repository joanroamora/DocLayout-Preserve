name: CI Security & DevSecOps

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "Feature*"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_CACHE_DIR: ".cache/pip"
  GEMINI_API_KEY: ""

jobs:
  secret-scanning:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for secret scan
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sast-and-sca:
    name: Python SAST (Bandit) & Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Bandit & pip-audit inside isolated .venv
        run: |
          mkdir -p .cache/pip .tmp
          export TMPDIR="$PWD/.tmp"
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements.txt bandit==1.8.3 pip-audit==2.8.0

      - name: Run Bandit SAST (Block Medium/High/Critical)
        run: ./.venv/bin/python -m bandit -r src -ll -ii

      - name: Run pip-audit SCA on pinned requirements
        run: ./.venv/bin/python -m pip_audit -r requirements.txt --strict

  trivy-config-and-container-scan:
    name: IaC Misconfiguration & Hardened Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy IaC & Manifest Misconfiguration Scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.28.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Build hardened non-root OCI image
        run: docker build --tag doclayout-preserve:ci-${{ github.sha }} .

      - name: Run Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.28.0
        with:
          image-ref: "doclayout-preserve:ci-${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
