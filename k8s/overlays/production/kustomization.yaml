apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: doclayout-preserve

resources:
  - ../../base

labels:
  - pairs:
      environment: production

replicas:
  - name: doclayout-ui
    count: 2
  - name: doclayout-api
    count: 2
  - name: doclayout-worker
    count: 3

patches:
  - target:
      kind: ConfigMap
      name: doclayout-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: "production"
  - target:
      kind: HorizontalPodAutoscaler
      name: doclayout-worker-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: HorizontalPodAutoscaler
      name: doclayout-api-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 8
