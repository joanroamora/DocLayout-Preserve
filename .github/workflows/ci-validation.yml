name: CI Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "Feature*"

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_CACHE_DIR: ".cache/pip"
  GEMINI_API_KEY: ""

jobs:
  validate-branch-naming:
    name: Validate Feature Branch Nomenclature
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate branch format (Feature<Number><PascalCase>)
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          export PYTHONPATH="$PWD/src"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python -m doclayout.core.governance "$PR_HEAD_REF"
          else
            python -m doclayout.core.governance "$PUSH_REF_NAME" --allow-protected
          fi

  lint-typecheck-and-tests:
    name: Reproducible .venv, Linters, Mypy & Mocked Pytest
    runs-on: ubuntu-latest
    needs: validate-branch-naming
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Create isolated .venv and install pinned dependencies
        run: |
          mkdir -p .cache/pip .tmp
          export TMPDIR="$PWD/.tmp"
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt flake8==7.2.0

      - name: Run Ruff Linter
        run: ./.venv/bin/python -m ruff check src tests

      - name: Run Flake8 Linter
        run: ./.venv/bin/python -m flake8 src tests --max-line-length=105 --extend-ignore=E203,E501,W503

      - name: Verify Black formatting
        run: ./.venv/bin/python -m black --check src tests

      - name: Verify isort import ordering
        run: ./.venv/bin/python -m isort --check-only src tests

      - name: Run Mypy static type verification
        run: ./.venv/bin/python -m mypy src tests

      - name: Run unit & headless UI tests with mocked Gemini (0 API tokens)
        run: ./.venv/bin/python -m pytest

  iac-format-check:
    name: Terraform Format & Static Check
    runs-on: ubuntu-latest
    needs: validate-branch-naming
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting if modules exist
        run: |
          if [ -d "infra/terraform" ] && [ -n "$(find infra/terraform -name '*.tf' -print -quit)" ]; then
            terraform fmt -check -recursive infra/terraform
          else
            echo "No Terraform .tf files present yet; skipping fmt check."
          fi
